<head>
<meta charset="utf-8">

<title>Track not found · B-SIDE</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
  :root{--bg:#12141c;--ink:#ece8df;--muted:#a3a2b4;--red:#ff5a4f;--amber:#f2b24c}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;
    background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 4px}
  main{display:grid;gap:14px;justify-items:center;max-width:34rem}
  .code{font:700 clamp(64px,18vw,140px)/.9 ui-monospace,monospace;letter-spacing:.04em;text-shadow:4px 4px 0 #6a2b3a,8px 8px 0 #2a1c2c}
  .code span{color:var(--red)}
  h1{margin:0;font-size:clamp(20px,4vw,26px)}
  p{margin:0;color:var(--muted)}
  a{display:inline-block;margin-top:6px;padding:11px 20px;background:var(--amber);color:#1a1408;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
  a:focus-visible{outline:2px solid #3fe0ff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">4<span>0</span>4</div>
  <h1>This track isn't in the crate.</h1>
  <p>The page you were looking for doesn't exist. Maybe The Topline wiped it.</p>
